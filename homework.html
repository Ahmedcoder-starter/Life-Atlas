<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Atlas | Homework</title>
  <style>
    body { margin:0; font-family:Poppins, Arial, sans-serif; background:#f7f7f5; }
    header { padding:24px 48px; display:flex; justify-content:space-between; }
    .logo { font-size:24px; font-weight:700; color:#ff5a3c; }
    nav a { margin-left:24px; text-decoration:none; color:#444; }
    .card {
      background:#fff;
      max-width:600px;
      margin:48px auto;
      padding:32px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
    }
    input, button { padding:10px; font-size:14px; }
    ul { padding-left:20px; }
    li { margin-bottom:8px; }
    .done { color:green; cursor:pointer; margin-left:10px; font-weight:600; }
     .logo:hover {
        color: #ff5a3c;
        text-shadow: 2px 2px 4px #000000;
      }
      nav a:hover {
        color: #ff5a3c;
        text-shadow: 2px 2px 4px #000000;
        font-size: 150%;
      }
  </style>
</head>
<body>
<header>
  <div class="logo">Life Atlas</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="goals.html">Goals</a>
    <a href="planner.html">Planner</a>
  </nav>
</header>

<div class="card">
  <h2>Homework Checklist</h2>
  <input id="taskInput" placeholder="Add homework..." />
  <button onclick="addTask()">Add</button>
  <ul id="taskList"></ul>
</div>

<script>
  const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

  function render() {
    const ul = document.getElementById('taskList');
    ul.innerHTML = '';
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.innerHTML = `${t} <span class="done" onclick="removeTask(${i})">✓</span>`;
      ul.appendChild(li);
    });
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    if (input.value.trim()) {
      tasks.push(input.value.trim());
      input.value = '';
      render();
    }
  }

  function removeTask(i) {
    tasks.splice(i, 1);
    render();
  }

  render();
</script>
</body>
</html>
