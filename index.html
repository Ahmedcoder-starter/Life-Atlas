<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Atlas | Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Poppins, Arial, sans-serif;
      background: #fafaf7;
      color: #222;
    }
    header {
      padding: 32px 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: 700; letter-spacing: 2px; }
    nav a {
      margin-left: 32px;
      text-decoration: none;
      color: #222;
      font-weight: 500;
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 120px);
    }
    .hero-left { padding: 96px 80px; }
    .tagline {
      font-size: 12px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 56px;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    p {
      max-width: 480px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 40px;
    }
    .btn {
      background: #ff5a3c;
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
    .hero-right {
      background: #d7efea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #2f6f68;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">LIFE ATLAS</div>
  <nav>
    <a href="homework.html">Homework</a>
    <a href="goals.html">Goals</a>
    <a href="planner.html">Planner</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-left">
    <div class="tagline">PLAN • TRACK • GROW</div>
    <h1>Hello, this is Life Atlas</h1>
    <p>
      Life Atlas is your personal space to stay organized and focused.
      Track your homework, write your goals, and build a clear path
      toward the life you want—one step at a time.
    </p>
    <a class="btn" href="homework.html">Start Mapping</a>
  </div>
  <div class="hero-right">
    Your Life, Mapped ✦
  </div>
</section>
</body>
</html>
